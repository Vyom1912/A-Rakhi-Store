<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Handmade Jeco Moti rakhis and custom name rakhis from a home business in Himatnagar. Pickup from Motipura, Himatnagar. Order on WhatsApp." />

    <!-- Favicon and icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/logo192.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%PUBLIC_URL%/logo512.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (Social media preview) -->
    <meta property="og:title" content="Rakhi Store | Homemade Rakhis Online" />
    <meta
      property="og:description"
      content="Handmade Jeco Moti rakhis and custom name rakhis. Pickup in Himatnagar. Order on WhatsApp!" />
    <meta
      property="og:image"
      content="https://vyom1912.github.io/A-Rakhi-Store/logo512.png" />
    <meta property="og:url" content="https://vyom1912.github.io/A-Rakhi-Store/" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet" />


    <!--
      GitHub Pages only serves index.html at the root, so 404.html sends deep links
      (e.g. /A-Rakhi-Store/cart) here as ?/cart, and this restores the real URL.
      It also upgrades old #/ links from when the site used HashRouter.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        } else if (l.hash.indexOf("#/") === 0) {
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, "") + l.hash.slice(1));
        }
      })(window.location);
    </script>

    <title>The Maroons: A Rakhi Store</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
